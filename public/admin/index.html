<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>Content Manager</title>

  <body>
    <!-- Pustaka Utama Decap CMS Versi Terbaru yang Stabil -->
    <script src="https://unpkg.com@^3.1.0/dist/decap-cms.js"></script>
    
    <!-- Skrip Otomatis untuk Menangkap Token Undangan Email -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
