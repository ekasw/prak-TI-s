baseURL = 'https://prak-ti-s.pages.dev'
languageCode = 'id-id'
title = 'Prak-TI`s'
theme = 'PaperMod'

[params]
    env = "production"
    title = "Prak-TI`s"
    description = "Berbagi tutorial IoT, pemrograman, dan dunia TI praktis."
    
    # Fitur pendukung PaperMod
    ShowReadingTime = true
    ShowShareButtons = true
    ShowCodeCopyButtons = true

[cover]
    linkable = true
    responsiveImages = false

[[module.mounts]]
    source = 'static'
    target = 'static'

[[module.mounts]]
    source = 'static/images'
    target = 'content/posts/images'